<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MysterBox 控制台</title>
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MysterBox">
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f0f; color: #e8e8e8;
    max-width: 720px; margin: 0 auto; padding: 20px 16px 80px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; font-weight: 600; }
  .sub { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
  .card {
    background: #1a1a1a; border-radius: 12px;
    padding: 18px 16px; margin-bottom: 14px;
    border: 1px solid #2a2a2a;
  }
  .card h2 { font-size: 0.95rem; margin-bottom: 12px; font-weight: 600; color: #ccc; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1 1 auto; }
  button {
    background: #2d6cdf; color: #fff; border: none;
    border-radius: 8px; padding: 10px 18px;
    font-size: 0.9rem; font-weight: 500; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #3b7cf0; }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
  button.secondary { background: #2a2a2a; border: 1px solid #444; }
  button.secondary:hover { background: #3a3a3a; }
  textarea, input[type=text], input[type=number], input[type=file] {
    background: #0d0d0d; border: 1px solid #333; color: #eee;
    border-radius: 8px; padding: 10px 12px;
    font-size: 0.9rem; font-family: inherit; width: 100%;
    outline: none;
  }
  textarea:focus, input:focus { border-color: #2d6cdf; }
  textarea { resize: vertical; min-height: 60px; }
  label { font-size: 0.8rem; color: #888; display: block; margin-bottom: 4px; }
  .field { margin-bottom: 10px; }
  .status-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 600;
  }
  .status-badge.off { background: #331111; color: #cc5555; }
  .status-badge.on { background: #113311; color: #55cc55; }
  .log {
    background: #0a0a0a; border-radius: 8px; padding: 10px 12px;
    font-family: ui-monospace, monospace; font-size: 0.75rem;
    color: #8a8a8a; max-height: 180px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all; line-height: 1.5;
  }
  .log .ok { color: #55cc55; }
  .log .err { color: #cc5555; }
  .log .info { color: #6699cc; }
  .preview-wrap { text-align: center; margin: 10px 0; }
  .preview-wrap img { max-width: 100%; max-height: 160px; border-radius: 8px; border: 1px solid #333; }
  .size-tag { font-size: 0.75rem; color: #888; margin-top: 4px; }
  .text-muted { color: #666; font-size: 0.8rem; }
  .url-hint {
    font-family: ui-monospace, monospace; font-size: 0.72rem;
    color: #7a9cc6; background: #0d1420; border-radius: 6px;
    padding: 8px 10px; margin-top: 8px; word-break: break-all;
  }
</style>
</head>
<body>

<h1>MysterBox 控制台</h1>
<p class="sub">蓝牙低功耗 · 文字 / 图片 · URL 指令</p>

<div class="card">
  <h2>连接与监听</h2>
  <div class="row" style="margin-bottom:10px">
    <button id="btnConnect">扫描并连接 MysterBox</button>
    <button id="btnDisconnect" class="secondary" disabled>断开</button>
    <span id="connBadge" class="status-badge off">未连接</span>
  </div>
  <div id="deviceInfo" class="text-muted" style="margin-bottom:10px">设备信息：—</div>
  <div class="row" style="margin-bottom:8px">
    <button id="btnStartListen" disabled>开始监听 URL 指令</button>
    <button id="btnStopListen" class="secondary" disabled>停止监听</button>
    <span id="listenBadge" class="status-badge off">未监听</span>
  </div>
  <div class="url-hint">
    文字：<b>?text=Hello</b>（可选 &amp;px=120 &amp;color=FF0000）<br>
    显示设备已有图：<b>?show=photo.jpg</b><br>
    从网址上传并显示：<b>?photo=https%3A%2F%2Fexample.com%2Fa.jpg</b>
  </div>
  <div id="logBox" class="log" style="margin-top:10px">日志就绪。</div>
</div>

<div class="card" id="textCard" style="opacity:.5;pointer-events:none">
  <h2>文字显示</h2>
  <div class="field">
    <label>输入文字（\n 换行，中文显示需用图片代替）</label>
    <textarea id="textInput" placeholder="Hello MysterBox">Hello MysterBox</textarea>
  </div>
  <div class="row" style="margin-bottom:10px">
    <div class="field" style="flex:1 1 100px">
      <label>字号上限 px（20–200）</label>
      <input type="number" id="textMaxPx" min="20" max="200" placeholder="默认">
    </div>
    <div class="field" style="flex:1 1 100px">
      <label>颜色 HEX（如 FF0000）</label>
      <input type="text" id="textColor" placeholder="默认" maxlength="6" style="text-transform:uppercase">
    </div>
  </div>
  <div class="row">
    <button id="btnSendText">发送文字</button>
    <button id="btnClearScreen" class="secondary">黑屏清空</button>
  </div>
</div>

<div class="card" id="imageCard" style="opacity:.5;pointer-events:none">
  <h2>图片显示</h2>
  <div class="field">
    <label>选择图片（JPEG / PNG，建议 &lt;80KB，分辨率 368x448）</label>
    <input type="file" id="imageFile" accept="image/jpeg,image/png">
  </div>
  <div class="preview-wrap" id="previewWrap" style="display:none">
    <img id="previewImg" alt="预览">
    <div class="size-tag" id="sizeTag"></div>
  </div>
  <div class="field">
    <label>设备端文件名（字母数字 . _ -，≤48）</label>
    <input type="text" id="remoteName" placeholder="如 photo.jpg">
  </div>
  <div class="row">
    <button id="btnUpload" disabled>上传图片</button>
    <button id="btnShowImage" class="secondary">显示该图片</button>
    <button id="btnHideImage" class="secondary">隐藏图片</button>
  </div>
</div>

<script>
// ================= 常量 =================
const SVC_UUID      = '7a1d0001-3b6e-4f2a-9c4d-2e8f1a5b0c01';
const CMD_UUID      = '7a1d0002-3b6e-4f2a-9c4d-2e8f1a5b0c01';
const EVENT_UUID    = '7a1d0003-3b6e-4f2a-9c4d-2e8f1a5b0c01';
const STATUS_UUID   = '7a1d0004-3b6e-4f2a-9c4d-2e8f1a5b0c01';
const TRANSFER_UUID = '7a1d0005-3b6e-4f2a-9c4d-2e8f1a5b0c01';
const QUEUE_KEY     = 'mysterbox_pending';

let bleDevice=null, server=null;
let cmdChar=null, eventChar=null, statusChar=null, transferChar=null;
let mtu=23, screenW=368, screenH=448, connected=false;
let uploadResolve=null, uploadReject=null;
let listening=false, pollTimer=null, bc=null;

// ================= 日志 =================
const logBox = document.getElementById('logBox');
function log(msg, cls='') {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

// ================= 连接 =================
document.getElementById('btnConnect').addEventListener('click', connect);
document.getElementById('btnDisconnect').addEventListener('click', disconnect);

async function connect() {
  if (!navigator.bluetooth) {
    log('当前环境不支持 Web Bluetooth。请使用 Bluefy。', 'err');
    return;
  }
  try {
    log('正在扫描 MysterBox...', 'info');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'MysterBox' }],
      optionalServices: [SVC_UUID],
    });
    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

    log('正在连接 GATT...', 'info');
    server = await bleDevice.gatt.connect();

    try {
      if (typeof server.requestMTU === 'function') {
        mtu = await server.requestMTU(512);
        log(`MTU：${mtu}`, 'ok');
      }
    } catch(e) { log('MTU 协商失败，使用默认值 23。', 'info'); }

    const svc = await server.getPrimaryService(SVC_UUID);
    cmdChar      = await svc.getCharacteristic(CMD_UUID);
    eventChar    = await svc.getCharacteristic(EVENT_UUID);
    statusChar   = await svc.getCharacteristic(STATUS_UUID);
    transferChar = await svc.getCharacteristic(TRANSFER_UUID);

    await eventChar.startNotifications();
    eventChar.addEventListener('characteristicvaluechanged', onEventNotification);
    log('已订阅 Event 通知。', 'ok');

    await readStatus();
    connected = true;
    setUIConnected(true);
    log('连接就绪。', 'ok');
  } catch(err) {
    log('连接失败：' + err.message, 'err');
  }
}

async function disconnect() {
  if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
  onDisconnected();
}

function onDisconnected() {
  connected = false;
  setUIConnected(false);
  log('设备已断开。', 'err');
}

function setUIConnected(state) {
  document.getElementById('connBadge').textContent = state ? '已连接' : '未连接';
  document.getElementById('connBadge').className = 'status-badge ' + (state ? 'on' : 'off');
  document.getElementById('btnConnect').disabled = state;
  document.getElementById('btnDisconnect').disabled = !state;
  ['textCard','imageCard'].forEach(id => {
    const el = document.getElementById(id);
    el.style.opacity = state ? '1' : '.5';
    el.style.pointerEvents = state ? 'auto' : 'none';
  });
  document.getElementById('btnStartListen').disabled = !state || listening;
  if (!state) {
    document.getElementById('deviceInfo').textContent = '设备信息：—';
    document.getElementById('btnUpload').disabled = true;
  }
}

async function readStatus() {
  try {
    const val = await statusChar.readValue();
    const text = new TextDecoder().decode(val);
    log(`Status: ${text}`, 'info');
    const m = text.match(/res=(\d+)x(\d+)/);
    if (m) { screenW = +m[1]; screenH = +m[2]; }
    document.getElementById('deviceInfo').textContent =
      `屏幕：${screenW} × ${screenH} px　|　MTU：${mtu}`;
  } catch(e) { log('读取 Status 失败：' + e.message, 'err'); }
}

// ================= 命令 =================
async function writeCommand(bytes) {
  if (!connected || !cmdChar) throw new Error('未连接');
  await cmdChar.writeValueWithoutResponse(new Uint8Array(bytes));
}

// ================= 文字 =================
async function sendTextValue(text, maxPx, colorHex) {
  const textBytes = new TextEncoder().encode(text);
  if (maxPx || colorHex) {
    const mp = maxPx ? parseInt(maxPx, 10) : 0;
    let r=255, g=255, b=255;
    if (colorHex && /^[0-9A-Fa-f]{6}$/.test(colorHex)) {
      r = parseInt(colorHex.slice(0,2),16);
      g = parseInt(colorHex.slice(2,4),16);
      b = parseInt(colorHex.slice(4,6),16);
    }
    const buf = new Uint8Array(5 + textBytes.length);
    buf[0]=0x11; buf[1]=mp & 0xFF; buf[2]=r; buf[3]=g; buf[4]=b;
    buf.set(textBytes, 5);
    await writeCommand(buf);
    log(`已发送 0x11 文字，长度 ${buf.length}`, 'ok');
  } else {
    const buf = new Uint8Array(1 + textBytes.length);
    buf[0]=0x01; buf.set(textBytes, 1);
    await writeCommand(buf);
    log(`已发送 0x01 文字，长度 ${buf.length}`, 'ok');
  }
}

document.getElementById('btnSendText').addEventListener('click', async () => {
  try {
    const text = document.getElementById('textInput').value;
    if (!text) { log('文字为空。', 'err'); return; }
    const px = document.getElementById('textMaxPx').value.trim();
    const color = document.getElementById('textColor').value.trim();
    await sendTextValue(text, px || null, color || null);
  } catch(e) { log('发送文字失败：' + e.message, 'err'); }
});

document.getElementById('btnClearScreen').addEventListener('click', async () => {
  try { await writeCommand([0x02]); log('已黑屏清空（0x02）。', 'ok'); }
  catch(e) { log('清空失败：' + e.message, 'err'); }
});

// ================= 图片 =================
const imageFileInput = document.getElementById('imageFile');
const remoteNameInput = document.getElementById('remoteName');
const btnUpload = document.getElementById('btnUpload');
const previewImg = document.getElementById('previewImg');
const previewWrap = document.getElementById('previewWrap');
const sizeTag = document.getElementById('sizeTag');

imageFileInput.addEventListener('change', () => {
  const file = imageFileInput.files[0];
  if (!file) { previewWrap.style.display='none'; btnUpload.disabled=true; return; }
  if (!remoteNameInput.value.trim()) {
    const ext = file.name.toLowerCase().endsWith('.png') ? '.png' : '.jpg';
    const base = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,40);
    remoteNameInput.value = (base || 'image') + ext;
  }
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  previewWrap.style.display = 'block';
  sizeTag.textContent = `${file.size.toLocaleString()} 字节 · ${file.type || '未知'}`;
  btnUpload.disabled = false;
  previewImg.onload = () => URL.revokeObjectURL(url);
});

async function uploadFile(file, name) {
  const buffer = await file.arrayBuffer();
  const nameBytes = new TextEncoder().encode(name);
  const cmd = new Uint8Array(1 + 4 + nameBytes.length);
  cmd[0] = 0x18;
  new DataView(cmd.buffer).setUint32(1, buffer.byteLength, true);
  cmd.set(nameBytes, 5);
  await writeCommand(cmd);
  log(`已声明上传 "${name}"，${buffer.byteLength} 字节`, 'info');

  // iOS 上 MTU 通常固定为 23，有效载荷为 20 字节
  const chunkSize = Math.max(20, mtu - 3);
  let offset = 0, packets = 0;

  while (offset < buffer.byteLength) {
    // ✅ 关键修复：使用 Uint8Array 视图和 byteLength
    const chunk = new Uint8Array(buffer, offset, Math.min(chunkSize, buffer.byteLength - offset));
    await transferChar.writeValueWithoutResponse(chunk);
    offset += chunk.byteLength;
    packets++;

    // 流控探测
    if (packets % 32 === 0 && offset < buffer.byteLength) {
      await writeCommand(new Uint8Array([0x1A, ...new TextEncoder().encode('none.none')]));
      await new Promise(r => setTimeout(r, 15));
    }
  }
  
  await writeCommand([0x19]);
  log(`Transfer 完成（${packets} 包），等待设备确认...`, 'info');

  const result = await waitForUploadResult(8000);
  if (result.arg !== 0) {
    throw new Error(`设备返回错误码 ${result.arg}`);
  }
  log(`上传成功："${name}"，${result.bytes} 字节。`, 'ok');
  return true;
}

function waitForUploadResult(timeoutMs) {
  return new Promise((resolve, reject) => {
    uploadResolve = resolve; uploadReject = reject;
    setTimeout(() => {
      if (uploadResolve) { uploadResolve=null; uploadReject=null; reject(new Error('等待上传结果超时')); }
    }, timeoutMs);
  });
}

btnUpload.addEventListener('click', async () => {
  const file = imageFileInput.files[0];
  const name = remoteNameInput.value.trim();
  if (!file) { log('未选择文件。', 'err'); return; }
  if (!/^[a-zA-Z0-9._-]{1,48}$/.test(name)) {
    log('文件名不合法（字母数字 . _ -，≤48）。', 'err'); return;
  }
  try { await uploadFile(file, name); }
  catch(e) { log('上传失败：' + e.message, 'err'); }
});

async function showImageByName(name) {
  const nameBytes = new TextEncoder().encode(name);
  const buf = new Uint8Array(1 + nameBytes.length);
  buf[0] = 0x1A; buf.set(nameBytes, 1);
  await writeCommand(buf);
  log(`已请求显示 "${name}"（0x1A）。`, 'ok');
}

document.getElementById('btnShowImage').addEventListener('click', async () => {
  const name = remoteNameInput.value.trim();
  if (!name) { log('请填写要显示的图片文件名。', 'err'); return; }
  try { await showImageByName(name); }
  catch(e) { log('显示失败：' + e.message, 'err'); }
});

document.getElementById('btnHideImage').addEventListener('click', async () => {
  try { await writeCommand([0x1C]); log('已隐藏图片（0x1C）。', 'ok'); }
  catch(e) { log('隐藏失败：' + e.message, 'err'); }
});

async function uploadFromUrl(url) {
  log(`下载图片 ${url} ...`, 'info');
  const resp = await fetch(url, { mode: 'cors' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const blob = await resp.blob();
  if (!blob.type.startsWith('image/')) throw new Error('不是图片：' + blob.type);
  const ext = blob.type.includes('png') ? '.png' : '.jpg';
  const name = 'remote' + Date.now() + ext;
  const file = new File([blob], name, { type: blob.type });
  log(`下载完成 ${blob.size} 字节，开始上传...`, 'info');
  await uploadFile(file, name);
  await showImageByName(name);
}

// ================= 事件通知 =================
function onEventNotification(event) {
  const val = event.target.value;
  if (val.byteLength < 6) return;
  const type = val.getUint8(0);
  const x = val.getUint16(1, true);
  const y = val.getUint16(3, true);
  const arg = val.getUint8(5);

  if (type === 0x10) {
    const bytes = (y << 16) | x;
    log(`📦 上传结果：arg=${arg}，设备已接收 ${bytes} 字节`, arg===0 ? 'ok' : 'err');
    if (uploadResolve) {
      const resolve = uploadResolve;
      uploadResolve = null; uploadReject = null;
      resolve({ arg, bytes });
    }
  } else if (type === 0x11) {
    const msgs = {0:'OK',1:'无法解码',4:'文件不存在'};
    log(`🖼️ 图片结果：${msgs[arg]||'未知'} (arg=${arg})`, arg===0 ? 'ok' : 'err');
  }
}

// ================= URL 指令与心跳保活 =================
function handleIncoming(cmd) {
  if (!connected) { log('收到指令但蓝牙未连接，已丢弃：' + JSON.stringify(cmd), 'err'); return; }
  let p = Promise.resolve();
  if (cmd.type === 'text')  p = sendTextValue(cmd.value, cmd.px, cmd.color);
  else if (cmd.type === 'show')  p = showImageByName(cmd.value);
  else if (cmd.type === 'photo') p = uploadFromUrl(cmd.value);
  p.catch(e => log('执行 URL 指令失败：' + e.message, 'err'));
}

function checkQueue() {
  if (!listening) return;
  const raw = localStorage.getItem(QUEUE_KEY);
  if (!raw) return;
  localStorage.removeItem(QUEUE_KEY);
  try {
    const cmd = JSON.parse(raw);
    if (cmd && cmd.type) {
      log('收到 URL 指令：' + JSON.stringify(cmd), 'info');
      handleIncoming(cmd);
    }
  } catch(e) { log('解析队列失败：' + e.message, 'err'); }
}

function onStorageChange(e) {
  if (e.key === QUEUE_KEY && e.newValue) checkQueue();
}

document.getElementById('btnStartListen').addEventListener('click', () => {
  if (listening) return;
  listening = true;
  document.getElementById('listenBadge').textContent = '监听中';
  document.getElementById('listenBadge').className = 'status-badge on';
  document.getElementById('btnStartListen').disabled = true;
  document.getElementById('btnStopListen').disabled = false;
  window.addEventListener('storage', onStorageChange);
  
  try {
    if (!bc) {
      bc = new BroadcastChannel('mysterbox');
      bc.onmessage = e => {
        if (e.data && e.data.type) checkQueue();
      };
    }
  } catch(e) {}

  // 每 500ms 轮询一次（作为兜底）
  pollTimer = setInterval(checkQueue, 500);
  checkQueue();
  log('已开始监听 URL 指令。（建议保持此页面在前台）', 'ok');
});

document.getElementById('btnStopListen').addEventListener('click', () => {
  listening = false;
  document.getElementById('listenBadge').textContent = '未监听';
  document.getElementById('listenBadge').className = 'status-badge off';
  document.getElementById('btnStartListen').disabled = !connected;
  document.getElementById('btnStopListen').disabled = true;
  window.removeEventListener('storage', onStorageChange);
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  log('已停止监听。', 'info');
});

// ✅ 修复：页面加载时解析 URL。如果是快捷指令触发，先保存 URL 参数，再清空地址栏，最后自动重连！
(function enqueueFromUrl() {
  const params = new URLSearchParams(location.search);
  let type=null, value=null;
  if (params.has('text'))  { type='text';  value=params.get('text'); }
  else if (params.has('photo')) { type='photo'; value=params.get('photo'); }
  else if (params.has('show'))  { type='show';  value=params.get('show'); }
  
  if (!type || !value) return;

  const cmd = {
    type, value,
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
  };
  if (params.has('px'))    cmd.px = params.get('px');
  if (params.has('color')) cmd.color = params.get('color');

  // 写入队列
  localStorage.setItem(QUEUE_KEY, JSON.stringify(cmd));
  
  // 清理地址栏（避免刷新重复发）
  history.replaceState({}, '', location.pathname);
  
  // 如果是快捷指令重新唤起了页面，这里直接触发一次检查
  setTimeout(() => {
    checkQueue();
    log('检测到 URL 指令，已触发。如未连接请先点击上方按钮连接。', 'info');
  }, 500);
})();

// ================= Service Worker =================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('SW 已注册'))
      .catch(err => console.warn('SW 注册失败', err));
  });
}
